<!DOCTYPE html>
<html>
<head>
    <title>Weather Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf6ff;
            text-align: center;
            padding: 50px;
        }

        .container {
            width: 350px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #aaa;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px 15px;
            margin-top: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🌤 Weather Checker</h2>

    <input type="text" id="city" placeholder="Enter city name">

    <br>

    <button onclick="getWeather()">Check Weather</button>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
